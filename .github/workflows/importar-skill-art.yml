name: Importar folhas de habilidades
on:
  push:
    branches: [main]
    paths: [assets/ai-source/skill-art-imports.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: nexus-skill-art-import
  cancel-in-progress: false
jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install Pillow==12.3.0
      - name: Baixar, inspecionar e recortar as 3 habilidades
        run: python scripts/import-skill-art.py
      - name: Gerar recursos e validar a integracao
        run: |
          npm run assets:expanded
          npm test -- --reporter=dot
      - name: Salvar folhas originais com segurança
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ai-source/skills assets/ai-source/skill-art-imports.json
          git commit -m 'Adicionar folhas de habilidades aprovadas dos novos personagens'
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep 3
          done
      - name: Publicar a versão atualizada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
