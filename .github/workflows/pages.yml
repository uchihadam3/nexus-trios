name: Build and deploy Nexus Trios
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# O deploy não espera a regressão de navegador.
#
# A regressão joga seis batalhas inteiras num Chromium, quatro delas com até
# 600 segundos de relógio real. Enquanto ela estava dentro deste workflow, cada
# publicação levava de trinta a sessenta minutos — e como o GitHub só guarda um
# run pendente por grupo, um terceiro push cancelava o segundo. O site ficava
# parado enquanto o repositório andava.
#
# Tudo que roda aqui agora leva menos de um minuto: testes, lint, typecheck e
# build. A regressão continua rodando a cada push, em `regression.yml`, e uma
# falha dela continua aparecendo vermelha — ela só não segura mais o site.
#
# E deploy se enfileira em vez de se cancelar.
#
# Com `cancel-in-progress: true`, cada push novo matava o deploy anterior no
# meio: cinco commits publicados, zero no ar. `false` faz a fila esperar. Com o
# pipeline curto, a espera é de segundos.
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_DEPLOY_BASE: /nexus-trios/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
