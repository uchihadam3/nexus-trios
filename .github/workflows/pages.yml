name: Build and deploy Nexus Trios
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Deploy se enfileira; não se cancela.
#
# Com `cancel-in-progress: true`, cada push novo matava o deploy anterior no
# meio. O pipeline aqui roda uma regressão de batalha em navegador antes de
# publicar e leva vários minutos, então uma sequência de pushes deixava o site
# parado no último commit que conseguiu terminar — enquanto o repositório já
# estava bem à frente. Foi exatamente o que aconteceu: cinco commits
# publicados, zero no ar.
#
# `false` faz a fila esperar em vez de cancelar. Um push a mais custa alguns
# minutos de espera; um deploy cancelado custa a versão inteira.
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_DEPLOY_BASE: /nexus-trios/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/battle-regression-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-regression-mobile
          path: test-results/battle-regression
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
